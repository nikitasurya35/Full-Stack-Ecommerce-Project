# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend Java (build, test, image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecom_Backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecom
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Tests
      env: 
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecom
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: Test_password_ci
        CORS_ALLOWED_ORIGINS: http://localhost:5173
        FILE_UPLOAD_DIR: /tmp/uploads
      run: mvn -B -pl product-service -am test
        
    - name: Build with Maven
      run: mvn -B -pl product-service -am clean package -DskipTests

    - name: List build files
      run: |
        find . -type f -name "*.jar"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
 
    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
 
    - name: Build and push backend image
      uses: docker/build-push-action@v6
      with:
        context: Ecom_Backend
        file: Ecom_Backend/product-service/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository_owner }}/ecom-backend:latest
          ${{ env.REGISTRY }}/${{ github.repository_owner }}/ecom-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  frontend:
    name: Frontend (build, test, image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecom_Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Ecom_Frontend/package-lock.json
 
      - name: Install dependencies
        run: npm ci
 
      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: Ecom_Frontend
          file: Ecom_Frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ecom-frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ecom-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    
