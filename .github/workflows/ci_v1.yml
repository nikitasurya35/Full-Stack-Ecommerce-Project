# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend Java (build, test, image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecom_Backend

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -B -pl product-service -am clean package -DskipTests

    - name: List build files
      run: |
        find . -type f -name "*.jar"

    - name: Upload the Jar file
      uses: actions/upload-artifact@v4
      with:
        name: product service jar
        path: ./product-service/product-service.jar
